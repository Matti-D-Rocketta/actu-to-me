# Groupes / sections pour le brief
sections:
  hydro:
    title: "💧 Hydrogène"
    scope: "Toute la chaîne hydrogène bas-carbone/renouvelable: production (électrolyse PEM/SOEC), stockage, transport (pipelines, 'corridors'), usages (industrie, mobilité lourde, aviation, maritime), politique publique, financements, chaînes d’approvisionnement."
    include_keywords: ["hydrogen", "hydrogène", "H2", "H₂", "electrolyser", "electrolyzer", "PEM", "SOEC", "fuel cell", "pile à combustible", "electrolysis", "ammonia", "NH3", "pipeline", "corridor"]
    exclude_keywords: ["nuclear fusion", "bitcoin", "VR", "gaming"]  # exemple
    feeds:
      - https://fuelcellsworks.com/feed/
      - https://hydrogen-central.com/feed/
      - https://www.france-hydrogene.org/actualites/feed/
      - https://www.hydrogenfuelnews.com/feed/
      - https://www.h2-view.com/rss/feed/e15e1d6422c35afec038fbd559797494/
      - https://www.h2-view.com/rss/feed/cd0a66d9f738890848ed4cec24acc857/
      - https://www.h2-view.com/rss/feed/f1a7dbd83a1495fb8436380bac6a83ff/ 
      - https://www.h2-view.com/rss/feed/70facf06dec98554386e326ffd0915d2/ 
      - https://www.h2-view.com/rss/feed/7e35ae9343750355e3b7ede657f9bb2b/ 
      - https://fchea.org/feed/
      - https://www.h2-international.com/feed/
      - https://www.powermag.com/category/hydrogen/feed/
  energy:
    title: "⚡ Énergie & Transition"
    scope: "Transition énergétique hors hydrogène: renouvelables (solaire, éolien, hydro, stockage batterie), réseaux, politiques climatiques, marchés de l’énergie, efficacité."
    include_keywords: ["renewable", "éolien", "solar", "photovoltaic", "storage", "battery", "grid", "PPA", "offshore", "wind", "policy"]
    exclude_keywords: ["hydrogen", "hydrogène", "H2", "H₂"]  # éviter les doublons avec hydro
    feeds:
      - https://www.power-technology.com/feed/
      - https://www.enerdata.net/rss.xml
      - https://cleantechnica.com/feed/
      - https://www.lemonde.fr/economie/rss_full.xml
      - https://www.usinenouvelle.com/rss/
      - https://www.pv-magazine.com/feed/
      - https://www.energy-storage.news/feed/
      - https://www.carbonbrief.org/feed/
      - https://www.offshorewind.biz/feed/
  world:
    title: "🌍 Monde & France"
    scope: "Macro: géopolitique, économie, politique publique générale. Pas de tech sectorielle détaillée."
    include_keywords: ["election", "policy", "macro", "inflation", "budget", "EU", "France", "US", "China", "sanctions", "trade"]
    exclude_keywords: []
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - https://feeds.feedburner.com/euronews/en/home/
      - https://www.lemonde.fr/en/international/rss_full.xml
      - https://theconversation.com/fr/international/articles.atom
      - https://www.h2-view.com/rss/feed/7e35ae9343750355e3b7ede657f9bb2b/ 
      - https://www.lemonde.fr/international/rss_full.xml
      - https://www.lemonde.fr/politique/rss_full.xml
      - https://www.francetvinfo.fr/monde.rss
  finance:
    title: "Finance & Marchés"
    scope: "Marchés financiers, financement de l’énergie/cleantech, dettes, actions, M&A, capex/opex, subventions."
    include_keywords: ["funding", "financing", "subsidy", "grant", "loan", "IPO", "M&A", "capex", "opex", "offtake", "contract"]
    exclude_keywords: []
