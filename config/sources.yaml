  tech:
    title: "Science & Tech"
    scope: "Science/tech générale: IA, réseaux, software/hardware, recherche. Pas d’énergie sectorielle (sauf percées scientifiques)."
    include_keywords: ["AI", "ML", "chip", "semiconductor", "quantum", "research", "breakthrough"]
    exclude_keywords: ["hydrogen", "hydrogène"]
